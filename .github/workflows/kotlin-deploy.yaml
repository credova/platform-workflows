name: "Kotlin: Deploy"

on:
  workflow_call:
    inputs:
      java-version:
        description: Java version
        type: string
        required: false
        default: "21"
      test-command:
        description: "Override test command (default: mise run test)"
        type: string
        required: false
        default: ""

      # Container
      container:
        description: Build, scan, and push a container image
        type: boolean
        required: false
        default: true
      image:
        description: "Single image - name:dockerfile or just name (defaults to ./Dockerfile)"
        type: string
        required: false
        default: ""
      images:
        description: "Multi-image YAML list with name, dockerfile, optional target, context, platform"
        type: string
        required: false
        default: ""
      platform:
        description: "Target platform (e.g. linux/amd64, linux/arm64)"
        type: string
        required: false
        default: linux/amd64
      container-reuse:
        description: Check for existing image before building
        type: boolean
        required: false
        default: true

      # Deployment
      deploy:
        description: Deploy to Cloud Run via pctl
        type: boolean
        required: false
        default: true
      config-path:
        description: Path to CUE config directory
        type: string
        required: false
        default: deployments/
      staging-target:
        description: "pctl target name for the staging deploy. Defaults to config-path for backward compatibility."
        type: string
        required: false
        default: ""
      production-target:
        description: "pctl target name for the canary/production deploy. Defaults to config-path for backward compatibility."
        type: string
        required: false
        default: ""
      canary:
        description: Canary traffic percentage (0 = full deploy)
        type: number
        required: false
        default: 0
      require-approval:
        description: Require manual approval for production
        type: boolean
        required: false
        default: true
      hotfix:
        description: "Hotfix mode: skip staging and tests, deploy straight to production"
        type: boolean
        required: false
        default: false
      dash0-annotations:
        description: Emit a deployment.succeeded annotation to Dash0 after each successful deploy. Requires DASH0_URL and DASH0_TOKEN org-level vars/secrets.
        type: boolean
        required: false
        default: false

      # Release
      release:
        description: Create a GitHub Release after successful production deploy
        type: boolean
        required: false
        default: false

      # Security
      security-severity:
        description: Minimum severity to fail container scan on
        type: string
        required: false
        default: HIGH

      # Notifications
      notifications:
        description: Send Slack notifications during deployment
        type: boolean
        required: false
        default: true

      # Post-staging validation gate
      # Optional. When set, a validate-staging job runs after the staging deploy and BEFORE the
      # production approval: it dispatches a workflow_dispatch workflow in the CALLER repo (e.g. a
      # post-deploy smoke/acceptance suite) and waits for it. If that run fails, production promotion
      # is skipped and the deploy pipeline fails. Left empty (the default), the job is skipped and
      # behaviour is unchanged for every existing consumer. The dispatched workflow, its runner
      # setup, and any credentials it needs live entirely in the caller repo — this workflow only
      # triggers it by filename and polls the result, so it stays language/app-agnostic. Requires the
      # caller to grant `actions: write` (to dispatch + read the run in its own repo).
      staging-validation-workflow:
        description: >
          Filename (e.g. "acceptance-tests.yaml") of a workflow_dispatch workflow in the caller repo
          to run after the staging deploy and gate production promotion on. Empty = disabled.
        type: string
        required: false
        default: ""
      staging-validation-inputs:
        description: >
          JSON object of inputs passed to the dispatched staging-validation workflow, e.g.
          '{"environment":"staging","suite":"smoke"}'. Ignored when staging-validation-workflow is empty.
        type: string
        required: false
        default: ""
      staging-validation-ref:
        description: >
          Branch or tag the staging-validation workflow is dispatched on (workflow_dispatch requires a
          branch/tag ref, not a commit SHA). Defaults to the ref that triggered the deploy
          (github.ref_name, e.g. master).
        type: string
        required: false
        default: ""
      staging-validation-timeout-minutes:
        description: Minutes to wait for the staging-validation run to conclude before failing.
        type: number
        required: false
        default: 20

      # Post-production validation
      # Optional, symmetric to the staging gate above but running AFTER the production deploy — a
      # post-deploy synthetic check against production. A failure fails the pipeline (and skips the
      # GitHub release) but does not roll back; recover via the rollback workflow. Same dispatch-and-
      # poll mechanism and the same `actions: write` requirement. Empty (default) = job skipped.
      production-validation-workflow:
        description: >
          Filename (e.g. "acceptance-tests.yaml") of a workflow_dispatch workflow in the caller repo
          to run after the production deploy. Empty = disabled.
        type: string
        required: false
        default: ""
      production-validation-inputs:
        description: >
          JSON object of inputs passed to the dispatched production-validation workflow, e.g.
          '{"environment":"production","suite":"smoke"}'. Ignored when production-validation-workflow is empty.
        type: string
        required: false
        default: ""
      production-validation-ref:
        description: >
          Branch or tag the production-validation workflow is dispatched on (workflow_dispatch requires
          a branch/tag ref, not a commit SHA). Defaults to the ref that triggered the deploy
          (github.ref_name, e.g. master).
        type: string
        required: false
        default: ""
      production-validation-timeout-minutes:
        description: Minutes to wait for the production-validation run to conclude before failing.
        type: number
        required: false
        default: 20

      # WarpBuild
      warpbuild-profile:
        description: "WarpBuild Docker Builder profile name"
        type: string
        required: false
        default: ""
      cache:
        description: "Enable WarpBuild dependency caching"
        type: boolean
        required: false
        default: false

      # Auth
      project-id:
        description: GCP project ID
        type: string
        required: false
        default: ""
      workload-identity-provider:
        description: Workload Identity Provider resource name
        type: string
        required: false
        default: ""
      service-account:
        description: Service account email to impersonate via WIF
        type: string
        required: false
        default: ""

      # Runner
      runner:
        description: "GitHub Actions runner label"
        type: string
        required: false
        default: warp-ubuntu-2404-x64-2x

    secrets:
      RELEASE_DOWNLOADER_APP_ID:
        required: false
      RELEASE_DOWNLOADER_APP_PRIVATE_KEY:
        required: false
      WARPBUILD_API_KEY:
        required: false
      PCTL_SLACK_BOT_TOKEN:
        required: false
      DASH0_TOKEN:
        required: false

jobs:
  # --- Input validation and image parsing ---
  validate:
    runs-on: ${{ inputs.runner }}
    outputs:
      image-matrix: ${{ steps.parse.outputs.image-matrix }}
      deploy-tag: ${{ steps.tag.outputs.deploy-tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate inputs
        shell: bash
        env:
          IMAGE: ${{ inputs.image }}
          IMAGES: ${{ inputs.images }}
        run: |
          if [ -n "${IMAGE}" ] && [ -n "${IMAGES}" ]; then
            echo "::error::Cannot specify both 'image' and 'images'. Use one or the other."
            exit 1
          fi

      - name: Parse image inputs
        id: parse
        uses: credova/platform-workflows/actions/parse-images@master
        with:
          image: ${{ inputs.image }}
          images: ${{ inputs.images }}
          container: ${{ inputs.container && 'true' || 'false' }}
          platform: ${{ inputs.platform }}
          repo-name: ${{ github.event.repository.name }}

      - name: Compute deploy tag
        id: tag
        shell: bash
        env:
          HOTFIX: ${{ inputs.hotfix }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          if [ "${HOTFIX}" = "true" ]; then
            echo "deploy-tag=${REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "deploy-tag=${SHA}" >> "$GITHUB_OUTPUT"
          fi

  # --- Tests (skipped for hotfix) ---
  test:
    if: ${{ !inputs.hotfix }}
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: credova/platform-workflows/actions/setup-language@master
        with:
          language: kotlin
          version: ${{ inputs.java-version }}
          cache: ${{ inputs.cache && 'true' || 'false' }}
      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
      - name: Test
        shell: bash
        env:
          TEST_COMMAND: ${{ inputs.test-command }}
        run: |
          if [ -n "${TEST_COMMAND}" ]; then
            eval "${TEST_COMMAND}"
          elif mise task ls 2>/dev/null | grep -q '^test '; then
            mise run test
          else
            echo "No test task found in mise.toml and no test-command override provided. Skipping."
          fi

  # --- Container build, scan, push ---
  build-scan-push:
    if: inputs.container && always() && !failure() && !cancelled()
    needs: [validate, test]
    runs-on: ${{ inputs.runner }}
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJson(needs.validate.outputs.image-matrix) }}
    steps:
      - uses: actions/checkout@v7
      - name: Build, scan, and push (${{ matrix.name }})
        uses: credova/platform-workflows/actions/container@master
        with:
          name: ${{ matrix.name }}
          dockerfile: ${{ matrix.dockerfile }}
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          platform: ${{ matrix.platform }}
          build: "true"
          push: "true"
          reuse: ${{ !inputs.hotfix && inputs.container-reuse && 'true' || 'false' }}
          tag: ${{ needs.validate.outputs.deploy-tag }}
          project-id: ${{ inputs.project-id }}
          workload-identity-provider: ${{ inputs.workload-identity-provider }}
          service-account: ${{ inputs.service-account }}
          severity: ${{ inputs.security-severity }}
          warpbuild-profile: ${{ inputs.warpbuild-profile }}
          warpbuild-api-key: ${{ secrets.WARPBUILD_API_KEY }}

  # --- Deploy staging (skipped for hotfix) ---
  deploy-staging:
    if: inputs.deploy && !inputs.hotfix && always() && !failure() && !cancelled()
    needs: [build-scan-push, test, validate]
    runs-on: ${{ inputs.runner }}
    environment: staging
    steps:
      - uses: actions/checkout@v7
      # Mint the pctl-download token in-job: create-github-app-token registers it
      # as a secret, and masked values are scrubbed from cross-job needs.* outputs
      # (they arrive empty), so it cannot be generated in a shared upstream job.
      - name: Generate release download token
        id: token
        uses: credova/platform-workflows/actions/auth-release-token@master
        with:
          client-id: ${{ secrets.RELEASE_DOWNLOADER_APP_ID }}
          private-key: ${{ secrets.RELEASE_DOWNLOADER_APP_PRIVATE_KEY }}
      - name: Deploy to staging
        uses: credova/platform-workflows/actions/deployment@master
        with:
          target: ${{ inputs.staging-target != '' && inputs.staging-target || inputs.config-path }}
          tag: ${{ needs.validate.outputs.deploy-tag }}
          config-path: ${{ inputs.config-path }}
          project-id: ${{ inputs.project-id }}
          workload-identity-provider: ${{ inputs.workload-identity-provider }}
          slack-token: ${{ secrets.PCTL_SLACK_BOT_TOKEN }}
          dash0-url: ${{ inputs.dash0-annotations && vars.DASH0_URL || '' }}
          dash0-token: ${{ inputs.dash0-annotations && secrets.DASH0_TOKEN || '' }}
          token: ${{ steps.token.outputs.token }}

  # --- Post-staging validation gate (opt-in) ---
  # Runs only when the caller sets staging-validation-workflow. Dispatches that workflow_dispatch
  # workflow in the CALLER repo (e.g. a post-deploy smoke/acceptance suite), waits for it, and fails
  # if it fails. Because the approval jobs below `needs:` this job, failure() propagates transitively
  # and skips production promotion — so a failed validation reds the pipeline instead of promoting.
  # When the input is empty the job is skipped (failure() stays false), leaving every existing
  # consumer's flow unchanged. All app-specific setup (runtime, browsers, credentials) lives in the
  # dispatched workflow; this job only triggers and polls, keeping kotlin-deploy language-agnostic.
  # Needs `actions: write` on the caller's GITHUB_TOKEN to dispatch + read runs in its own repo.
  validate-staging:
    if: inputs.deploy && !inputs.hotfix && inputs.staging-validation-workflow != '' && always() && !failure() && !cancelled()
    needs: [deploy-staging]
    runs-on: ${{ inputs.runner }}
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch staging-validation workflow and wait
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ inputs.staging-validation-workflow }}
          REF: ${{ inputs.staging-validation-ref != '' && inputs.staging-validation-ref || github.ref_name }}
          INPUTS_JSON: ${{ inputs.staging-validation-inputs }}
          TIMEOUT_MINUTES: ${{ inputs.staging-validation-timeout-minutes }}
        run: |
          set -euo pipefail

          # gh workflow run does not return a run id, so record the newest existing run id for this
          # workflow+branch first, dispatch, then poll for a run newer than that. The deploy
          # concurrency group serialises deploys, so at most one dispatch is in flight per commit.
          before="$(gh run list -R "${REPO}" --workflow "${WORKFLOW}" --branch "${REF}" \
            --event workflow_dispatch --json databaseId --jq 'map(.databaseId) | max // 0')"

          # Turn the JSON inputs object into repeated `--raw-field key=value` args (empty = none).
          field_args=()
          if [ -n "${INPUTS_JSON}" ]; then
            while IFS= read -r kv; do field_args+=(--raw-field "$kv"); done < <(
              printf '%s' "${INPUTS_JSON}" | jq -r 'to_entries[] | "\(.key)=\(.value)"'
            )
          fi

          # Log only that inputs were provided, never their values — this is a generic workflow and
          # a caller's inputs may carry sensitive identifiers, and workflow logs are retained.
          if [ -n "${INPUTS_JSON}" ]; then in_note="with caller-provided inputs"; else in_note="no inputs"; fi
          echo "Dispatching ${WORKFLOW} on ${REF} (${in_note})"
          gh workflow run "${WORKFLOW}" -R "${REPO}" --ref "${REF}" "${field_args[@]}"

          # Wait (up to ~2 min) for the dispatched run to register, then track it by the greatest
          # databaseId newer than the pre-dispatch max for this workflow+branch.
          #
          # Accepted limitation (CodeRabbit, PR #31): this correlates by "newest new run", not by a
          # per-dispatch token, so a *concurrent* workflow_dispatch of the SAME workflow on the SAME
          # ref within this window could be tracked instead. In practice the window is closed:
          # deploys are serialised by the top-level concurrency group, and the 6h schedule is a
          # `schedule` event (excluded by --event workflow_dispatch). The residual case is a human
          # manually dispatching this same workflow on the deploy branch mid-deploy. A fully-correct
          # fix (inject a correlation id + match on run-name) would change the consumer contract, so
          # it is deferred pending Platform-team input.
          run_id=""
          for _ in $(seq 1 24); do
            run_id="$(gh run list -R "${REPO}" --workflow "${WORKFLOW}" --branch "${REF}" \
              --event workflow_dispatch --json databaseId \
              --jq "map(.databaseId) | map(select(. > ${before})) | max // empty")"
            [ -n "${run_id}" ] && break
            sleep 5
          done
          if [ -z "${run_id}" ]; then
            echo "::error::staging-validation workflow '${WORKFLOW}' did not start on ${REF} (no run newer than ${before})"
            exit 1
          fi
          run_url="$(gh run view "${run_id}" -R "${REPO}" --json url --jq .url)"
          echo "Waiting on staging-validation run: ${run_url}"

          # Poll to conclusion or timeout. A run queued behind another (acceptance suites often cap
          # concurrency to one) stays non-'completed' until it starts, which the timeout covers.
          # Convert minutes → whole seconds via awk so a fractional input (e.g. 0.5) doesn't break
          # Bash integer arithmetic; floor to a 1s minimum.
          timeout_seconds="$(awk -v m="${TIMEOUT_MINUTES}" 'BEGIN { s = m * 60; if (s < 1) s = 1; printf "%d", s }')"
          deadline=$(( $(date +%s) + timeout_seconds ))
          while :; do
            read -r status conclusion < <(gh run view "${run_id}" -R "${REPO}" \
              --json status,conclusion --jq '"\(.status) \(.conclusion)"')
            if [ "${status}" = "completed" ]; then
              if [ "${conclusion}" = "success" ]; then
                echo "staging-validation passed: ${run_url}"
                break
              fi
              echo "::error::staging-validation failed (${conclusion}): ${run_url}"
              exit 1
            fi
            if [ "$(date +%s)" -ge "${deadline}" ]; then
              echo "::error::staging-validation timed out after ${TIMEOUT_MINUTES}m (still '${status}'): ${run_url}"
              exit 1
            fi
            sleep 15
          done

  # --- Canary flow ---
  approve-canary:
    if: inputs.deploy && inputs.canary > 0 && always() && !failure() && !cancelled()
    needs: [deploy-staging, validate-staging, build-scan-push]
    runs-on: ${{ inputs.runner }}
    environment: production-canary
    steps:
      - run: echo "Canary deployment approved"

  deploy-canary:
    if: inputs.deploy && inputs.canary > 0
    needs: [approve-canary, validate]
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Generate release download token
        id: token
        uses: credova/platform-workflows/actions/auth-release-token@master
        with:
          client-id: ${{ secrets.RELEASE_DOWNLOADER_APP_ID }}
          private-key: ${{ secrets.RELEASE_DOWNLOADER_APP_PRIVATE_KEY }}
      - name: Deploy canary
        uses: credova/platform-workflows/actions/deployment@master
        with:
          target: ${{ inputs.production-target != '' && inputs.production-target || inputs.config-path }}
          tag: ${{ needs.validate.outputs.deploy-tag }}
          canary: ${{ inputs.canary }}
          config-path: ${{ inputs.config-path }}
          project-id: ${{ inputs.project-id }}
          workload-identity-provider: ${{ inputs.workload-identity-provider }}
          slack-token: ${{ secrets.PCTL_SLACK_BOT_TOKEN }}
          dash0-url: ${{ inputs.dash0-annotations && vars.DASH0_URL || '' }}
          dash0-token: ${{ inputs.dash0-annotations && secrets.DASH0_TOKEN || '' }}
          token: ${{ steps.token.outputs.token }}

  # --- Production approval ---
  approve-production:
    if: inputs.deploy && inputs.require-approval && always() && !failure() && !cancelled()
    needs: [build-scan-push, deploy-staging, validate-staging, deploy-canary]
    runs-on: ${{ inputs.runner }}
    environment: production
    steps:
      - run: echo "Production deployment approved"

  # --- Retag images for production ---
  retag-production:
    if: inputs.container && inputs.deploy && always() && !failure() && !cancelled()
    needs: [approve-production, validate]
    runs-on: ${{ inputs.runner }}
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJson(needs.validate.outputs.image-matrix) }}
    steps:
      - uses: actions/checkout@v7
      - name: Retag for production (${{ matrix.name }})
        uses: credova/platform-workflows/actions/container@master
        with:
          name: ${{ matrix.name }}
          retag: "true"
          source-tag: ${{ needs.validate.outputs.deploy-tag }}
          tag: ${{ needs.validate.outputs.deploy-tag }}-prd
          project-id: ${{ inputs.project-id }}
          workload-identity-provider: ${{ inputs.workload-identity-provider }}
          service-account: ${{ inputs.service-account }}

  # --- Deploy production ---
  deploy-production:
    if: inputs.deploy && always() && !failure() && !cancelled()
    needs: [approve-production, retag-production, validate]
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Generate release download token
        id: token
        uses: credova/platform-workflows/actions/auth-release-token@master
        with:
          client-id: ${{ secrets.RELEASE_DOWNLOADER_APP_ID }}
          private-key: ${{ secrets.RELEASE_DOWNLOADER_APP_PRIVATE_KEY }}

      - name: Require Slack token for production
        if: inputs.notifications
        shell: bash
        env:
          PCTL_SLACK_BOT_TOKEN: ${{ secrets.PCTL_SLACK_BOT_TOKEN }}
        run: |
          if [ -z "${PCTL_SLACK_BOT_TOKEN}" ]; then
            echo "::error::PCTL_SLACK_BOT_TOKEN secret is required for production deploys when notifications are enabled"
            exit 1
          fi

      - name: Promote canary to production
        if: inputs.canary > 0
        uses: credova/platform-workflows/actions/deployment@master
        with:
          target: ${{ inputs.production-target != '' && inputs.production-target || inputs.config-path }}
          action: promote
          config-path: ${{ inputs.config-path }}
          project-id: ${{ inputs.project-id }}
          workload-identity-provider: ${{ inputs.workload-identity-provider }}
          slack-token: ${{ secrets.PCTL_SLACK_BOT_TOKEN }}
          dash0-url: ${{ inputs.dash0-annotations && vars.DASH0_URL || '' }}
          dash0-token: ${{ inputs.dash0-annotations && secrets.DASH0_TOKEN || '' }}
          token: ${{ steps.token.outputs.token }}

      - name: Deploy to production (full)
        if: inputs.canary == 0
        uses: credova/platform-workflows/actions/deployment@master
        with:
          target: ${{ inputs.production-target != '' && inputs.production-target || inputs.config-path }}
          tag: ${{ needs.validate.outputs.deploy-tag }}-prd
          config-path: ${{ inputs.config-path }}
          project-id: ${{ inputs.project-id }}
          workload-identity-provider: ${{ inputs.workload-identity-provider }}
          slack-token: ${{ secrets.PCTL_SLACK_BOT_TOKEN }}
          dash0-url: ${{ inputs.dash0-annotations && vars.DASH0_URL || '' }}
          dash0-token: ${{ inputs.dash0-annotations && secrets.DASH0_TOKEN || '' }}
          token: ${{ steps.token.outputs.token }}

  # --- Post-production validation (opt-in) ---
  # Symmetric to validate-staging but runs AFTER the production deploy as a post-deploy synthetic
  # check. On failure the release job below is skipped (via needs) and the pipeline is red; it does
  # not roll back (use the rollback workflow). Skipped when production-validation-workflow is empty.
  # Needs `actions: write` on the caller's GITHUB_TOKEN to dispatch + read runs in its own repo.
  validate-production:
    if: inputs.deploy && inputs.production-validation-workflow != '' && always() && !failure() && !cancelled()
    needs: [deploy-production]
    runs-on: ${{ inputs.runner }}
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch production-validation workflow and wait
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ inputs.production-validation-workflow }}
          REF: ${{ inputs.production-validation-ref != '' && inputs.production-validation-ref || github.ref_name }}
          INPUTS_JSON: ${{ inputs.production-validation-inputs }}
          TIMEOUT_MINUTES: ${{ inputs.production-validation-timeout-minutes }}
        run: |
          set -euo pipefail

          # gh workflow run does not return a run id, so record the newest existing run id for this
          # workflow+branch first, dispatch, then poll for a run newer than that. The deploy
          # concurrency group serialises deploys, so at most one dispatch is in flight per commit.
          before="$(gh run list -R "${REPO}" --workflow "${WORKFLOW}" --branch "${REF}" \
            --event workflow_dispatch --json databaseId --jq 'map(.databaseId) | max // 0')"

          # Turn the JSON inputs object into repeated `--raw-field key=value` args (empty = none).
          field_args=()
          if [ -n "${INPUTS_JSON}" ]; then
            while IFS= read -r kv; do field_args+=(--raw-field "$kv"); done < <(
              printf '%s' "${INPUTS_JSON}" | jq -r 'to_entries[] | "\(.key)=\(.value)"'
            )
          fi

          # Log only that inputs were provided, never their values — this is a generic workflow and
          # a caller's inputs may carry sensitive identifiers, and workflow logs are retained.
          if [ -n "${INPUTS_JSON}" ]; then in_note="with caller-provided inputs"; else in_note="no inputs"; fi
          echo "Dispatching ${WORKFLOW} on ${REF} (${in_note})"
          gh workflow run "${WORKFLOW}" -R "${REPO}" --ref "${REF}" "${field_args[@]}"

          # Wait (up to ~2 min) for the dispatched run to register, then track it by the greatest
          # databaseId newer than the pre-dispatch max for this workflow+branch.
          #
          # Accepted limitation (CodeRabbit, PR #31): this correlates by "newest new run", not by a
          # per-dispatch token, so a *concurrent* workflow_dispatch of the SAME workflow on the SAME
          # ref within this window could be tracked instead. In practice the window is closed:
          # deploys are serialised by the top-level concurrency group, and the 6h schedule is a
          # `schedule` event (excluded by --event workflow_dispatch). The residual case is a human
          # manually dispatching this same workflow on the deploy branch mid-deploy. A fully-correct
          # fix (inject a correlation id + match on run-name) would change the consumer contract, so
          # it is deferred pending Platform-team input.
          run_id=""
          for _ in $(seq 1 24); do
            run_id="$(gh run list -R "${REPO}" --workflow "${WORKFLOW}" --branch "${REF}" \
              --event workflow_dispatch --json databaseId \
              --jq "map(.databaseId) | map(select(. > ${before})) | max // empty")"
            [ -n "${run_id}" ] && break
            sleep 5
          done
          if [ -z "${run_id}" ]; then
            echo "::error::production-validation workflow '${WORKFLOW}' did not start on ${REF} (no run newer than ${before})"
            exit 1
          fi
          run_url="$(gh run view "${run_id}" -R "${REPO}" --json url --jq .url)"
          echo "Waiting on production-validation run: ${run_url}"

          # Poll to conclusion or timeout. Convert minutes → whole seconds via awk so a fractional
          # input (e.g. 0.5) doesn't break Bash integer arithmetic; floor to a 1s minimum.
          timeout_seconds="$(awk -v m="${TIMEOUT_MINUTES}" 'BEGIN { s = m * 60; if (s < 1) s = 1; printf "%d", s }')"
          deadline=$(( $(date +%s) + timeout_seconds ))
          while :; do
            read -r status conclusion < <(gh run view "${run_id}" -R "${REPO}" \
              --json status,conclusion --jq '"\(.status) \(.conclusion)"')
            if [ "${status}" = "completed" ]; then
              if [ "${conclusion}" = "success" ]; then
                echo "production-validation passed: ${run_url}"
                break
              fi
              echo "::error::production-validation failed (${conclusion}): ${run_url}"
              exit 1
            fi
            if [ "$(date +%s)" -ge "${deadline}" ]; then
              echo "::error::production-validation timed out after ${TIMEOUT_MINUTES}m (still '${status}'): ${run_url}"
              exit 1
            fi
            sleep 15
          done

  # --- Release ---
  release:
    if: inputs.release && always() && !failure() && !cancelled()
    needs: [deploy-production, validate-production, validate]
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create release tag
        if: ${{ !inputs.hotfix }}
        id: tag
        uses: credova/platform-workflows/actions/increment-tag@master

      - name: Create GitHub Release
        if: ${{ !inputs.hotfix }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release create "${TAG}" \
            --title "${TAG}" \
            --generate-notes

      - name: Create GitHub Release (hotfix)
        if: ${{ inputs.hotfix }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.deploy-tag }}
        run: |
          gh release create "${TAG}" \
            --title "${TAG} (hotfix)" \
            --generate-notes \
            --notes-start-tag "$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo '')" \
            2>/dev/null || echo "Release ${TAG} already exists, skipping"

  # --- Cancel superseded pending deploys ---
  cancel-superseded:
    if: inputs.deploy && !inputs.hotfix
    needs: [deploy-production]
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Cancel superseded pending deploys
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          echo "Checking for superseded pending deploys..."
          WAITING_RUNS=$(gh api "repos/${REPO}/actions/runs?status=waiting" \
            --jq '.workflow_runs[] | select(.head_sha != env.CURRENT_SHA) | .id')
          for run_id in ${WAITING_RUNS}; do
            echo "Cancelling superseded run #${run_id}"
            gh api "repos/${REPO}/actions/runs/${run_id}/cancel" -X POST || true
          done
