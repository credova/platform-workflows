name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type: major, minor, patch"
        required: false
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: warp-ubuntu-2404-x64-2x
    steps:
      - name: Generate workflow editor token
        id: workflow-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.WORKFLOW_EDITOR_APP_CLIENT_ID }}
          private-key: ${{ secrets.WORKFLOW_EDITOR_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-workflows: write

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.workflow-token.outputs.token }}

      - name: Check if tag already pinned
        id: guard
        shell: bash
        run: |
          # Pushing the tag below re-triggers this workflow (the app token
          # doesn't get GITHUB_TOKEN's recursion protection). That second run
          # checks out the pin commit, where there is nothing left to do.
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]] && \
             [[ "$(git log -1 --format=%s)" == "chore: pin internal action refs to ${GITHUB_REF_NAME}" ]]; then
            echo "skip=true" >> "${GITHUB_OUTPUT}"
          else
            echo "skip=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Resolve tag
        id: tag
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            # Triggered by a manually pushed tag - use it directly
            echo "tag=${GITHUB_REF_NAME}" >> "${GITHUB_OUTPUT}"
          else
            # Triggered by workflow_dispatch - compute next version
            echo "tag=" >> "${GITHUB_OUTPUT}"
          fi

      - name: Compute next version
        id: increment
        if: steps.guard.outputs.skip != 'true' && steps.tag.outputs.tag == ''
        uses: ./actions/increment-tag
        with:
          bump: ${{ github.event.inputs.bump || 'patch' }}

      - name: Set final tag
        id: final
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag || steps.increment.outputs.tag }}
        run: |
          # Strict shape check: the tag is later interpolated into a sed
          # replacement, so anything outside vMAJOR.MINOR.PATCH is rejected.
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::invalid tag '${TAG}' - expected vMAJOR.MINOR.PATCH"
            exit 1
          fi
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

      - name: Rewrite refs and push tag
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        env:
          TAG: ${{ steps.final.outputs.tag }}
          GIT_TOKEN: ${{ steps.workflow-token.outputs.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GIT_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          # Rewrite @master refs in a release commit, tag it, then reset master back.
          # master stays clean with @master refs; the tag snapshot has pinned refs.
          # Exclude this workflow: its own sed pattern below contains the
          # literal being replaced, so the sweep would corrupt the tag snapshot.
          find . -not -path './.git/*' -not -path './.github/workflows/release.yaml' \
            \( -name '*.yaml' -o -name '*.yml' \) \
            -exec grep -lF 'credova/platform-workflows/' {} \; \
            | xargs -r sed -i "s|credova/platform-workflows/\(.\+\)@master|credova/platform-workflows/\1@${TAG}|g"
          git commit -am "chore: pin internal action refs to ${TAG}"
          RELEASE_SHA=$(git rev-parse HEAD)
          echo "RELEASE_SHA=${RELEASE_SHA}" >> "${GITHUB_ENV}"

          # For dispatch-triggered releases the tag doesn't exist yet; for tag-push
          # it already exists, so we move it to the pinned-refs commit.
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            git tag -f "${TAG}"
            git push origin "${TAG}" --force
          else
            git tag "${TAG}"
            git push origin "${TAG}"
          fi

          git reset --hard HEAD~1

      - name: Update major version tag
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        env:
          TAG: ${{ steps.final.outputs.tag }}
        run: |
          MAJOR=$(echo "${TAG}" | grep -oP 'v\d+')
          git tag -f "${MAJOR}" "${RELEASE_SHA}"
          git push origin "${MAJOR}" --force

      - name: Create GitHub Release
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.final.outputs.tag }}
        run: |
          # Greatest release tag strictly less than TAG, so notes only cover the delta.
          # awk exits 0 even when nothing matches, so PREV_TAG is empty on first release
          # without tripping pipefail/-e.
          PREV_TAG=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=version:refname \
            | awk -v t="${TAG}" '$0 == t {exit} {p=$0} END {print p}')

          # A release may already exist when the tag was created through the
          # GitHub UI (which creates the release AND pushes the tag, triggering
          # this workflow). In that case delete it - keeping the tag, which we
          # already force-moved to the pinned-refs commit - and recreate it so
          # the notes are the delta from PREV_TAG and it targets the pinned tag.
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release delete "${TAG}" --yes
          fi

          if [[ -n "${PREV_TAG}" ]]; then
            gh release create "${TAG}" \
              --title "${TAG}" \
              --generate-notes \
              --notes-start-tag "${PREV_TAG}"
          else
            gh release create "${TAG}" \
              --title "${TAG}" \
              --generate-notes
          fi
