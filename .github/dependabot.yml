version: 2

updates:
  # Workflows (.github/workflows/*.yaml) and composite actions (actions/*/action.yaml)
  - package-ecosystem: github-actions
    directories:
      - /
      - /actions/*
    schedule:
      interval: cron
      cronjob: "0 4 28 * *" # 28th, 4am LA
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    rebase-strategy: disabled
    commit-message:
      prefix: "chore(actions)"
    labels:
      - dependencies
      - github-actions
    groups:
      gha-version:
        applies-to: version-updates
        patterns: ["*"]
      gha-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      - dependency-name: reeveops/reeve
